name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Nexus Launcher (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar TypeScript + React
        run: npm run build

      - name: Generar instalador y portable .exe
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}

      - name: Subir instalador (Setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Launcher-Setup-Windows
          path: release/*Setup*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Subir portable (.exe sin instalador)
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Launcher-Portable-Windows
          path: release/*portable*.exe
          retention-days: 30
          if-no-files-found: warn

      - name: Crear Release con ambos archivos (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*Setup*.exe
            release/*portable*.exe
          generate_release_notes: true
          name: "Nexus Launcher ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
