name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Nexus Launcher (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar TypeScript + React
        run: npm run build

      - name: Generar instalador .exe
        run: npx electron-builder --win nsis --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir instalador (Setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Launcher-Setup-Windows
          path: release/*Setup*.exe
          retention-days: 30
          if-no-files-found: error
